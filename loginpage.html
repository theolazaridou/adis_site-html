<html>

<head>
    <style>
        body { 
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; }

    .login-box {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      width: 300px;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-box input[type="text"],
    .login-box input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background-color: #f9775b;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .login-box button:hover {
      background-color: #f85f3d;
    }
  </style>
    </style>
    <meta charset="UTF-8">
    <body style="background-color:#F8F8FF">
    <title>Login Page</title>
</head>

<body>
  <div class="login-box">
    <h2>Login</h2>
    <form>
        Username: <input type="text" placeholder="Όνομα Χρήστη" required>
        Password: <input type="password" placeholder="Κωδικός" required>
        <small>
            Remember me: <input type="checkbox" placeholder="Remember me">
        </small>
        <button type="submit">Login</button>
        <div style="margin-top: 20px; text-align: center;">
          <small>
            <a href="forgotyourpassword.html" style="color: #f85f3d; text-decoration: none; font-size: 14px;">
              Forgot your Password
          </small>
          </a>
        </div>        
    </form>
  </div>
</body>

</html>
