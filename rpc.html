  <body>
  
    <form id="materialsForm" onsubmit="return handleSubmit(event)">
      <center>
        <h2>Καταγραφή Υλικών <br> Compare Supplier Costs </h2>
      </center>
  
      <label for="product">Προϊόν:</label>
      <input type="text" id="product" name="product" required>
  
      <label for="line">Γραμμή Παραγωγής:</label>
      <input type="text" id="line" name="line" required>
  
      <div style="margin-top: 30px;"></div>
  
      <div id="materials"></div>
  
      <button type="button" onclick="addMaterial()">+ Προσθήκη Υλικού</button>
      <div class="error-message" id="error">Παρακαλώ συμπληρώστε όλα τα πεδία σωστά.</div>
      <br>
      <button type="submit">Υποβολή</button>
      <button type="button" onclick="saveReport()">Αποθήκευση</button>

  
      <div id="result"></div>
    </form>
    <script>
      let counter = 0;
  
      function addMaterial() {
        counter++;
        const container = document.getElementById('materials');
  
        const div = document.createElement('div');
        div.className = 'material';
        div.innerHTML = `
          <label>Όνομα Υλικού:</label>
          <input type="text" name="materialName" required>
          <label>Κόστος Πρώτης Ύλης (€):</label>
          <input type="number" name="materialCost" required>
          <label>Προμηθευτής:</label>
          <input type="text" name="supplier" required>
        `;
        container.appendChild(div);
      }
  
      window.onload = () => {
        addMaterial();
        addMaterial();
      };
  
      function handleSubmit(event) {
        event.preventDefault();
        const form = document.getElementById('materialsForm');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const names = Array.from(form.querySelectorAll('[name="materialName"]'));
        const costs = Array.from(form.querySelectorAll('[name="materialCost"]'));
        const suppliers = Array.from(form.querySelectorAll('[name="supplier"]'));
  
        const product = document.getElementById('product').value.trim();
        const line = document.getElementById('line').value.trim();
  
        let valid = true;
        const entries = [];
  
        for (let i = 0; i < names.length; i++) {
          const name = names[i].value.trim();
          const cost = parseFloat(costs[i].value);
          const supplier = suppliers[i].value.trim();
  
          if (!name || isNaN(cost) || !supplier || !product || !line) {
            valid = false;
            break;
          }
  
          entries.push({ name, cost, supplier });
        }
  
        if (!valid) {
          errorDiv.style.display = 'block';
          resultDiv.innerHTML = '';
          return false;
        } else {
          errorDiv.style.display = 'none';
        }
  
        entries.sort((a, b) => a.cost - b.cost);
  
        let html = `<h3>Προϊόν: ${product}</h3>`;
        html += `<h4>Γραμμή Παραγωγής: ${line}</h4>`;
        html += '<h3>Πρώτες ύλες σε αύξουσα σειρά κόστους:</h3><ul>';
        for (const entry of entries) {
          html += `<li>${entry.name} (Κόστος: €${entry.cost.toFixed(2)}, Προμηθευτής: ${entry.supplier})</li>`;
        }
        html += '</ul>';
        resultDiv.innerHTML = html;
  
        return true;
      }
      function saveReport() {
      alert('Το report αποθηκεύτηκε με επιτυχία!');
    }
    </script>
